# project.yaml — configuração do space (UAH-Orquestra: adaptação do UAH-lite).
# Campos uah_lite/project/risk/runtime/integrations/policy são lidos por `python3 .uah/uah.py compile`.
# Os demais (dono, creditos, servidores, autonomia...) são lidos pelos agentes e pela coordenação opcional.
uah_lite: "1"
project:
  id: "<id-sem-espacos>"
  title: "<título>"
  domains: []            # ex.: software, data-analysis, literature-review
risk: medium             # low = só proibições | medium = plano aprovado antes de alterar (G1) | high = G1 + checkpoint (G4)
runtime:
  python: "python3"
notes:                   # campos da orquestração (o uah.py só aceita extras dentro de notes)
  dono: "<responsavel>"    # pessoa ou equipe responsável pelo projeto
  maquina_mestre: "<host>" # host ou ambiente principal; não implica hierarquia entre máquinas
  prioridade: normal       # normal | alta (usado pela coordenação e na fila de recursos)
  creditos:
    perfil: economico      # preferência local; escolha provedores e modelos conforme o projeto
    trava: 0.80            # fração sugerida do orçamento; ajuste à janela de uso do provedor
    noite_pode_zerar: false # opt-in: permite esgotar o orçamento durante operação sem supervisão
  servidores:
    usa: []                # ex.: [example-cluster]; aliases fictícios, substitua pelos seus
    cotas: {}              # ex.: {example_cluster_threads: 4}; defina conforme os recursos disponíveis
    so_leitura: false
  dados_sensiveis: false   # true = restringir envio aos provedores autorizados para esses dados
  git:
    remoto: "<usuario>/<repo>"
    versoes: [v1]
  autonomia:
    overrides: {}          # só ajusta a tabela de orquestra/AUTONOMIA_E_MODOS.md
integrations: []         # workflow-digestion, publish-documents, calcboard, sci-figures, specboard
policy:
  immutable_paths: []    # nunca alterar (ex.: dados brutos, saídas de cálculo concluídas)
  protected_paths: []    # alterar só com confirmação (ex.: manuscrito vigente)
  plan_gate_paths: []    # extras liberados antes da aprovação (ex.: ["notes/**"]); vazio por padrão
  bash_deny: []
  bash_ask: []
  settings_allow: []
  settings_ask: []
  settings_deny: []
  grantable: []
