# Fictional literature-review example; replace all project choices for your work.
schema_version: "0.2"

project:
  id: example-evidence-review
  title: Example evidence review of research methods
  owner: Example research team

objective: >-
  Map the literature on a chosen research question, compare available methods,
  and identify evidence gaps before proposing follow-up work.

domain:
  - literature-review

background: >-
  The project begins as a literature-grounded study and may later produce a
  reproducible research protocol. The first phase must not commit to an
  execution stack before the evidence and methods are assessed.

workspace:
  path: ./project
  access: read-write
  system_of_record: true

target_agents:
  - codex
  - codex-cloud
  - claude-code

inputs: []

deliverables:
  - id: evidence-map
    description: Evidence-linked map of mechanisms, proteins, methods, and gaps
    format: [markdown, csv]
    acceptance:
      - Every material claim has a source pointer
      - DOI and bibliographic metadata are verified
  - id: research-plan
    description: Staged research and validation plan
    format: [markdown]
    acceptance:
      - Assumptions and decision gates are explicit

constraints:
  - Preserve original sources
  - Prefer primary literature
  - Separate evidence from inference

deadline: null
duration: long-running

risk:
  scientific: high
  operational: medium
  external: low
  irreversibility: low
  uncertainty: high
  cost: medium

evidence_burden: scientific

requested_capabilities:
  - discovery
  - scientific-evidence
  - lexical-retrieval
  - artifact-production
  - independent-review

available_tools: []
external_actions: []
human_gates:
  - Approve research methodology before execution
  - Approve any paid compute or external publication
special_requirements:
  - Use the minimum sufficient agent topology
language: en
